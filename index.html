<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tokscale · local token overview</title>
  <style>
    :root {
      color-scheme: dark;
      --black: #050507;
      --canvas: #0a090e;
      --panel: #0d0c14;
      --panel-2: #12101a;
      --stripe: #1b1827;
      --line: #2a2435;
      --line-soft: #201c2b;
      --text: #d2c9dc;
      --muted: #9b91a6;
      --dim: #746c7e;
      --violet: #c6b5ff;
      --mint: #66e5cb;
      --blue-mint: #8bd5e1;
      --gold: #f0cf39;
      --orange: #ef8d58;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--black);
      color: var(--text);
      font-family: "SF Mono", "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 15px;
      letter-spacing: -0.035em;
      overflow-x: auto;
    }
    button { font: inherit; }
    .app { width: min(100%, 1180px); min-width: 660px; min-height: 100vh; padding: 31px 16px 48px; background: linear-gradient(180deg, rgba(255,255,255,.012), transparent 25%), var(--canvas); }
    .brand { position: absolute; top: 33px; left: 30px; z-index: 2; color: var(--violet); font-size: 17px; line-height: 1; text-shadow: 0 0 12px rgba(198,181,255,.16); }
    .nav { height: 54px; border: 1px solid var(--line); display: flex; align-items: flex-end; padding-left: 126px; overflow: hidden; white-space: nowrap; background: rgba(10,9,14,.65); }
    .nav button { height: 34px; min-width: 104px; border: 0; border-left: 1px solid var(--line-soft); background: transparent; color: var(--muted); padding: 0 17px; cursor: pointer; text-align: left; transition: color .15s ease, background .15s ease; }
    .nav button:first-child { border-left: 0; }
    .nav button:hover, .nav button.active { color: var(--violet); background: rgba(198,181,255,.045); }
    .rule { height: 20px; border-bottom: 1px solid var(--line); }
    .page { display: none; }
    .page.active { display: block; }
    .section { position: relative; margin-top: 0; border: 1px solid var(--line); border-top: 0; padding: 0 10px 13px; background: linear-gradient(90deg, rgba(255,255,255,.01), transparent 65%); }
    .section + .section { margin-top: 12px; border-top: 1px solid var(--line); }
    .section-title { display: inline-block; position: relative; margin: -1px 0 10px 0; padding: 0 8px 0 0; background: var(--canvas); color: var(--violet); font-size: 17px; font-weight: 400; line-height: 20px; }
    .section-title::after { content: ""; position: absolute; left: 76px; right: -1000px; top: 9px; height: 1px; background: var(--line); z-index: -1; }
    .subtle { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(135px, 1fr)); gap: 8px; }
    .stat { border: 1px solid var(--line-soft); background: var(--panel); padding: 11px 12px 12px; min-height: 76px; }
    .stat-label { color: var(--muted); font-size: 12px; margin-bottom: 7px; }
    .stat-value { color: var(--text); font-size: 22px; line-height: 1; }
    .stat-value.violet { color: var(--violet); }
    .stat-value.mint { color: var(--mint); }
    .stat-value.blue { color: var(--blue-mint); }
    .overview-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, .85fr); gap: 12px; margin-top: 12px; }
    .card { border: 1px solid var(--line); padding: 12px 13px 14px; background: var(--panel); }
    .card h2 { margin: 0 0 11px; color: var(--violet); font-size: 16px; font-weight: 400; }
    .provider-row { display: grid; grid-template-columns: 150px 1fr 85px; align-items: center; gap: 10px; min-height: 29px; }
    .provider-name { color: var(--mint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .provider-track { height: 7px; background: #211d2c; overflow: hidden; }
    .provider-fill { height: 100%; background: var(--violet); }
    .provider-cost { color: var(--blue-mint); text-align: right; }
    .trend { display: flex; align-items: end; gap: 5px; height: 120px; border-bottom: 1px solid var(--line); padding: 4px 0 0; }
    .trend-bar { flex: 1; min-width: 5px; background: var(--mint); opacity: .82; position: relative; }
    .trend-bar:hover { opacity: 1; background: var(--violet); }
    .trend-bar span { display: none; position: absolute; bottom: calc(100% + 5px); left: 50%; transform: translateX(-50%); color: var(--text); font-size: 10px; white-space: nowrap; }
    .trend-bar:hover span { display: block; }
    .trend-labels { display: flex; justify-content: space-between; color: var(--dim); font-size: 10px; padding-top: 6px; }
    .table-wrap { overflow-x: auto; }
    .data-table { width: 100%; border-collapse: collapse; min-width: 610px; }
    .data-table th, .data-table td { height: 24px; padding: 0 9px; text-align: left; font-weight: 400; white-space: nowrap; }
    .data-table th { color: var(--violet); border-bottom: 1px solid var(--line); }
    .data-table th:not(:first-child), .data-table td:not(:first-child) { text-align: right; }
    .data-table tbody tr:nth-child(even) { background: rgba(27,24,39,.76); }
    .data-table tbody tr:hover { background: rgba(85,71,113,.22); }
    .data-table td:first-child { color: var(--mint); }
    .data-table td.provider { color: var(--muted); text-align: left; }
    .data-table td.tokens { color: #e4dfe8; }
    .data-table td.cost { color: var(--blue-mint); }
    .data-table td.gold { color: var(--gold); }
    .model-report { width: 100%; border-collapse: collapse; min-width: 560px; }
    .model-report th, .model-report td { height: 26px; padding: 0 9px; text-align: left; font-weight: 400; white-space: nowrap; }
    .model-report th { color: var(--violet); border-bottom: 1px solid var(--line); font-size: 16px; }
    .model-report th:not(:first-child), .model-report td:not(:first-child) { text-align: right; }
    .model-report tbody tr:nth-child(even) { background: rgba(27,24,39,.76); }
    .model-report tbody tr:hover, .model-report tbody tr.selected { background: rgba(55,44,63,.75); }
    .model-report td:first-child { color: var(--mint); font-size: 16px; }
    .model-report td.tokens { color: #e4dfe8; font-size: 16px; }
    .model-report td.cost { color: var(--blue-mint); font-size: 16px; }
    .sort { color: var(--violet); margin-left: 7px; font-size: 13px; }
    .breakdown { margin-top: 12px; border: 1px solid var(--line); padding: 12px 13px 14px; background: var(--panel); }
    .breakdown h2 { margin: 0 0 10px; color: var(--violet); font-size: 16px; font-weight: 400; }
    .breakdown-grid { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 7px; }
    .breakdown-item { border: 1px solid var(--line-soft); padding: 8px 9px; }
    .breakdown-label { color: var(--muted); font-size: 11px; margin-bottom: 5px; }
    .breakdown-value { color: var(--text); font-size: 14px; }
    .breakdown-value.mint { color: var(--mint); }
    .breakdown-value.blue { color: var(--blue-mint); }
    .period-tools { display: flex; gap: 6px; margin-bottom: 12px; }
    .period-tools button { border: 1px solid var(--line); background: var(--panel); color: var(--muted); padding: 5px 9px; cursor: pointer; }
    .period-tools button.active, .period-tools button:hover { color: var(--violet); border-color: var(--violet); }
    .period-summary { display: flex; gap: 18px; color: var(--muted); margin: 0 0 12px; font-size: 12px; }
    .period-summary strong { color: var(--text); font-weight: 400; }
    .bars { display: grid; gap: 7px; }
    .bar-row { display: grid; grid-template-columns: 135px minmax(100px, 1fr) 86px 92px; gap: 10px; align-items: center; }
    .bar-label { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { height: 12px; background: #211d2c; }
    .bar-fill { height: 100%; min-width: 2px; background: linear-gradient(90deg, var(--mint), var(--violet)); }
    .bar-tokens, .bar-cost { text-align: right; color: var(--text); }
    .bar-cost { color: var(--blue-mint); }
    .footer-note { margin: 12px 0 0; color: var(--dim); font-size: 11px; line-height: 1.45; }
    .range-label { height: 28px; padding: 8px 2px 0; color: var(--muted); font-size: 12px; }
    .breakdown-table { margin-top: 2px; }
    .breakdown-note { margin-top: 10px; color: var(--dim); font-size: 11px; }
    @media (max-width: 850px) { .stats { grid-template-columns: repeat(2, 1fr); } .overview-grid { grid-template-columns: 1fr; } .breakdown-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <main class="app" aria-label="tokscale local token dashboard">
    <div class="brand">tokscale</div>
    <nav class="nav" aria-label="Primary navigation">
      <button class="active" data-view="overview">Overview</button>
      <button data-view="usage">Usage</button>
      <button data-view="models">Models</button>
      <button data-view="daily">Daily</button>
      <button data-view="weekly">Weekly</button>
      <button data-view="monthly">Monthly</button>
      <button data-view="hourly">Hourly</button>
    </nav>
    <div class="rule"></div>
    <div class="range-label" id="range-label"></div>

    <section class="page active" data-page="overview">
      <section class="section">
        <h1 class="section-title">Overview</h1>
        <div class="stats" id="stats"></div>
        <div class="overview-grid">
          <article class="card"><h2>Provider split</h2><div id="providers"></div></article>
          <article class="card"><h2>Daily trend</h2><div class="trend" id="trend"></div><div class="trend-labels" id="trend-labels"></div></article>
        </div>
      </section>
      <section class="section"><h1 class="section-title">Top models</h1><div class="table-wrap"><table class="data-table" id="top-models"></table></div></section>
    </section>

    <section class="page" data-page="usage"><section class="section"><h1 class="section-title">Usage</h1><p class="subtle" id="usage-range"></p><div class="table-wrap"><table class="data-table" id="usage-table"></table></div></section></section>
    <section class="page" data-page="models"><section class="section"><h1 class="section-title">Models</h1><p class="subtle">Model totals from your local Codex and Claude records.</p><div class="table-wrap"><table class="model-report" id="models-table"></table></div><article class="breakdown" id="model-breakdown"></article></section></section>
    <section class="page" data-page="daily"><section class="section"><h1 class="section-title">Daily</h1><div id="period-daily"></div></section></section>
    <section class="page" data-page="weekly"><section class="section"><h1 class="section-title">Weekly</h1><div id="period-weekly"></div></section></section>
    <section class="page" data-page="monthly"><section class="section"><h1 class="section-title">Monthly</h1><div id="period-monthly"></div></section></section>
    <section class="page" data-page="hourly"><section class="section"><h1 class="section-title">Hourly</h1><div id="period-hourly"></div></section></section>

    <p class="footer-note">Local-first snapshot · <span id="footer-meta"></span></p>
  </main>

  <script src="usage-data.js"></script>
  <script>
    const data = window.TOKSCALE_DATA || { generated_at: null, timezone: 'local', period_start: null, period_end: null, event_count: 0, totals: { tokens: 0, cost: 0, models: 0, providers: 0 }, models: [], providers: {}, periods: { hourly: [], daily: [], weekly: [], monthly: [] }, notes: [] };
    const $ = (selector) => document.querySelector(selector);

    function compact(value) {
      if (value == null) return '—';
      if (value >= 1e9) return (value / 1e9).toFixed(1).replace('.0', '') + 'B';
      if (value >= 1e6) return (value / 1e6).toFixed(1).replace('.0', '') + 'M';
      if (value >= 1e3) return (value / 1e3).toFixed(1).replace('.0', '') + 'K';
      return String(value);
    }
    function cost(value, known = true) {
      if (!known) return '—';
      if (value >= 1000) return '$' + (value / 1000).toFixed(1).replace('.0', '') + 'K';
      if (value > 0 && value < 0.01) return '$' + value.toFixed(3);
      return '$' + (value || 0).toFixed(2);
    }
    function esc(value) { return String(value ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }

    function renderStats() {
      const total = data.totals || {};
      $('#stats').innerHTML = [
        ['Total tokens', compact(total.tokens), 'mint'],
        ['API-equivalent cost', cost(total.cost, total.cost_known !== false), 'blue'],
        ['Models', total.models ?? 0, 'violet'],
        ['Events', data.event_count ?? 0, '']
      ].map(([label, value, tone]) => `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value ${tone}">${value}</div></div>`).join('');
    }

    function renderProviders() {
      const entries = Object.entries(data.providers || {}).sort((a, b) => b[1].tokens - a[1].tokens);
      const max = entries[0]?.[1].tokens || 1;
      $('#providers').innerHTML = entries.length ? entries.map(([name, info]) => `<div class="provider-row"><div class="provider-name">${esc(name)}</div><div class="provider-track"><div class="provider-fill" style="width:${Math.max(2, info.tokens / max * 100)}%"></div></div><div class="provider-cost">${compact(info.tokens)}</div></div>`).join('') : '<p class="subtle">Run <strong>python3 tokscale.py refresh</strong> first.</p>';
    }

    function renderTrend() {
      const rows = (data.periods?.daily || []).slice(-14);
      const max = Math.max(...rows.map(row => row.tokens), 1);
      $('#trend').innerHTML = rows.length ? rows.map(row => `<div class="trend-bar" style="height:${Math.max(3, row.tokens / max * 100)}%"><span>${esc(row.period)} · ${compact(row.tokens)}</span></div>`).join('') : '<p class="subtle">No daily data.</p>';
      $('#trend-labels').innerHTML = rows.length ? `<span>${esc(rows[0].period)}</span><span>${esc(rows[rows.length - 1].period)}</span>` : '';
    }

    function modelRows(models) {
      return models.map(model => `<tr><td>${esc(model.model)}</td><td class="provider">${esc(model.provider)}</td><td class="tokens">${compact(model.tokens)}</td><td class="cost">${cost(model.cost, model.cost_known !== false)}</td><td>${model.events}</td></tr>`).join('');
    }
    function tableHeader() { return '<thead><tr><th>Model</th><th>Provider</th><th>Tokens</th><th>Cost</th><th>Events</th></tr></thead>'; }
    function modelReportRows(models) {
      return models.map((model, index) => `<tr data-model-index="${index}"><td>${esc(model.model)}</td><td class="tokens">${compact(model.tokens)}</td><td class="cost">${cost(model.cost, model.cost_known !== false)}</td></tr>`).join('');
    }
    function renderBreakdown(model) {
      if (!model) { $('#model-breakdown').innerHTML = '<p class="subtle">No model data yet. Run <strong>python3 tokscale.py refresh</strong>.</p>'; return; }
      const pricingLabel = model.pricing?.label || 'not configured';
      const rows = model.pricing?.kind === 'claude' ? [
        ['Input', model.input_tokens, model.pricing.input, model.input_tokens * model.pricing.input / 1e6],
        ['Output', model.output_tokens, model.pricing.output, model.output_tokens * model.pricing.output / 1e6],
        ['Cache read', model.cache_read_tokens, model.pricing.cache_read, model.cache_read_tokens * model.pricing.cache_read / 1e6],
        ['Cache write', model.cache_write_tokens, model.pricing.cache_write, model.cache_write_tokens * model.pricing.cache_write / 1e6],
        ['Total', model.tokens, null, model.cost]
      ] : [['Total', model.tokens, model.pricing?.rate ?? null, model.cost]];
      $('#model-breakdown').innerHTML = `<h2>Breakdown · ${esc(model.model)}</h2><div class="table-wrap"><table class="model-report breakdown-table"><thead><tr><th>Metric</th><th>Tokens</th><th>Rate / 1M</th><th>Cost</th></tr></thead><tbody>${rows.map(([label, tokens, rate, amount]) => `<tr><td>${label}</td><td class="tokens">${compact(tokens)}</td><td>${rate == null ? '—' : '$' + rate}</td><td class="cost">${cost(amount, amount != null)}</td></tr>`).join('')}</tbody></table></div><div class="breakdown-note">${esc(model.provider)} · ${model.events} events · ${esc(pricingLabel)}${model.pricing?.kind === 'flat' ? ' · local Codex data exposes a cumulative thread total only' : ''}</div>`;
    }
    function renderModels() {
      const models = data.models || [];
      $('#top-models').innerHTML = tableHeader() + `<tbody>${modelRows(models.slice(0, 8))}</tbody>`;
      $('#usage-table').innerHTML = tableHeader() + `<tbody>${modelRows(models)}</tbody>`;
      $('#models-table').innerHTML = '<thead><tr><th>Model</th><th>Tokens <span class="sort">▼</span></th><th>Cost</th></tr></thead><tbody>' + modelReportRows(models) + '</tbody>';
      const rows = [...document.querySelectorAll('#models-table tbody tr')];
      rows.forEach((row, index) => row.addEventListener('click', () => { rows.forEach(item => item.classList.remove('selected')); row.classList.add('selected'); renderBreakdown(models[index]); }));
      if (rows[0]) { rows[0].classList.add('selected'); renderBreakdown(models[0]); }
    }

    function renderPeriod(period) {
      const rows = data.periods?.[period] || [];
      const visible = rows.slice(-60);
      const max = Math.max(...visible.map(row => row.tokens), 1);
      const totalTokens = visible.reduce((sum, row) => sum + row.tokens, 0);
      const totalCost = visible.reduce((sum, row) => sum + row.cost, 0);
      const target = $('#period-' + period);
      target.innerHTML = `<div class="period-tools"><button class="active" data-period="${period}">${period}</button><span class="subtle">${visible.length} buckets · ${data.timezone || 'local time'}</span></div><div class="period-summary"><span>Range <strong>${interval(data.period_start, data.period_end)}</strong></span><span>Tokens <strong>${compact(totalTokens)}</strong></span><span>Cost <strong>${cost(totalCost, visible.every(row => row.cost_known))}</strong></span><span>Events <strong>${visible.reduce((sum, row) => sum + row.events, 0)}</strong></span></div><div class="bars">${visible.length ? visible.map(row => `<div class="bar-row"><div class="bar-label">${esc(row.period)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(1, row.tokens / max * 100)}%"></div></div><div class="bar-tokens">${compact(row.tokens)}</div><div class="bar-cost">${cost(row.cost, row.cost_known)}</div></div>`).join('') : '<p class="subtle">No data for this period.</p>'}</div>`;
    }

    function interval(start, end) {
      if (!start || !end) return 'No data';
      const options = { month: 'short', day: 'numeric', timeZone: data.timezone || undefined };
      const formatter = new Intl.DateTimeFormat('en-US', options);
      const first = new Date(start); const last = new Date(end);
      const left = formatter.format(first); const right = formatter.format(last);
      return left === right ? left : left + ' – ' + right;
    }

    function render() {
      renderStats(); renderProviders(); renderTrend(); renderModels();
      ['daily', 'weekly', 'monthly', 'hourly'].forEach(renderPeriod);
      $('#usage-range').textContent = `${interval(data.period_start, data.period_end)} · ${data.event_count || 0} local usage records`;
      $('#range-label').textContent = 'Range · ' + interval(data.period_start, data.period_end);
      $('#footer-meta').textContent = `${data.timezone || 'local'} · generated ${data.generated_at || 'not yet refreshed'}`;
    }

    document.querySelectorAll('.nav button').forEach(button => button.addEventListener('click', () => {
      document.querySelectorAll('.nav button').forEach(item => item.classList.remove('active'));
      document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
      button.classList.add('active');
      $('[data-page="' + button.dataset.view + '"]').classList.add('active');
    }));
    render();
  </script>
</body>
</html>
